name: MyMart CI & Quality Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Shared Package
        run: |
          npm --prefix packages/shared install
          npm run build:shared

      - name: Install and Build Admin Dashboard
        run: |
          npm --prefix apps/admin-dashboard install
          npm run build:admin

      - name: Run Test Suite (59 assertions)
        run: npm test
