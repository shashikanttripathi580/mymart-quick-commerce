name = "mymart-image-worker"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Environment Variables configured in Cloudflare Dashboard / wrangler secret:
# SUPABASE_URL: "https://your-project.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY: "secret"
# R2_ACCOUNT_ID: "your-cloudflare-account-id"
# R2_ACCESS_KEY_ID: "your-access-key-id"
# R2_SECRET_ACCESS_KEY: "your-secret-access-key"
# R2_BUCKET_NAME: "mymart-product-images"
# R2_PUBLIC_DOMAIN: "https://images.mymartdelivery.in"

[vars]
ENVIRONMENT = "production"
MAX_FILE_SIZE_BYTES = 5242880 # 5 MB max
